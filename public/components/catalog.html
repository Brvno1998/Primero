<!-- Catalog Section Component -->
<section class="catalog-section" id="catalog">
  <div class="container">
    <div class="section-header">
      <span class="section-subtitle">Nuestra Selección</span>
      <h2 class="section-title">Colección Destacada</h2>
    </div>

    <!-- Filter Controls & Toolbar -->
    <div class="filter-wrapper">
      <div class="category-tabs">
        <button class="tab-btn active" data-category="all"><i class="fas fa-layer-group"></i> Colección Completa (800+)</button>
        <button class="tab-btn" data-category="hombres">Hombres</button>
        <button class="tab-btn" data-category="mujeres">Mujeres</button>
        <button class="tab-btn" data-category="accesorios">Accesorios</button>
        <button class="tab-btn" data-category="ofertas">Ofertas 🔥</button>
      </div>

      <div class="toolbar-grid">
        <!-- Search Box with Voice Search Assistant -->
        <div class="search-input-group">
          <i class="fas fa-search"></i>
          <input type="text" id="search-input" class="search-input" placeholder="Buscar prenda o hablar...">
          <button id="voice-search-btn" type="button" title="Hablar con AURA IA" aria-label="Búsqueda por voz">
            <i class="fas fa-microphone"></i>
          </button>
        </div>

        <!-- Price Range Slider -->
        <div class="price-filter-box">
          <label for="price-slider">Máx: <span id="price-value">$500</span></label>
          <input type="range" id="price-slider" min="50" max="500" step="10" value="500">
        </div>

        <!-- Sort Select -->
        <div class="sort-select-wrapper">
          <select id="sort-select" class="sort-select" aria-label="Ordenar Por">
            <option value="popular">Más Populares</option>
            <option value="price-low">Precio: Menor a Mayor</option>
            <option value="price-high">Precio: Mayor a Menor</option>
            <option value="rating">Mejor Valorados</option>
          </select>
        </div>
      </div>
    </div>

    <!-- Products Dynamic Grid -->
    <div class="products-grid" id="products-grid">
      <!-- Rendered via JS -->
    </div>
  </div>
</section>
