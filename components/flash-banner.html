<!-- Flash Sale Live Countdown Section Component -->
<section class="flash-sale-section" id="flash-sale-section">
  <div class="container">
    <div class="flash-sale-card">
      <div class="flash-sale-content">
        <span class="flash-tag"><i class="fas fa-bolt"></i> Venta Relámpago AURA</span>
        <h2 class="flash-title">Oferta Exclusiva 24 Horas</h2>
        <p class="flash-desc">Obtén hasta un <strong>40% OFF</strong> en piezas seleccionadas de streetwear y lujo urbano. La oferta termina pronto:</p>
        
        <div class="countdown-box" id="flash-countdown">
          <div class="time-unit">
            <span id="timer-hours">04</span>
            <small>Horas</small>
          </div>
          <span class="time-colon">:</span>
          <div class="time-unit">
            <span id="timer-minutes">18</span>
            <small>Minutos</small>
          </div>
          <span class="time-colon">:</span>
          <div class="time-unit">
            <span id="timer-seconds">32</span>
            <small>Segundos</small>
          </div>
        </div>

        <a href="#catalog" class="btn-primary" style="margin-top: 24px;">
          Aprovechar Descuento <i class="fas fa-arrow-right"></i>
        </a>
      </div>
      <div class="flash-sale-img">
        <img src="assets/images/flash_sale.jpg" alt="Venta Relámpago AURA">
      </div>
    </div>
  </div>
</section>
