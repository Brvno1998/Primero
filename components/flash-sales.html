<!-- Midnight Flash Sale Section Component -->
<section class="flash-sales-section" id="flash-sales-section" style="padding: 60px 0; background: linear-gradient(135deg, rgba(239,68,68,0.08), rgba(18,18,18,0.95)); border-top: 1px solid var(--color-border); border-bottom: 1px solid var(--color-border);">
  <div class="container">
    <div class="flash-header" style="display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 20px; margin-bottom: 32px;">
      <div>
        <span class="section-subtitle" style="color: #ef4444;"><i class="fas fa-bolt"></i> Edición Limitada Nocturna</span>
        <h2 class="section-title" style="font-size: 2.2rem; margin: 0; color: #ffffff;">Ofertas Relámpago VIP ⚡</h2>
      </div>
      
      <!-- Live Ticking Countdown Clock -->
      <div class="countdown-timer-box" style="display: flex; gap: 12px; align-items: center; background: rgba(0,0,0,0.6); padding: 12px 24px; border-radius: var(--radius-full); border: 1px solid rgba(239,68,68,0.4);">
        <span style="font-size: 0.85rem; color: var(--color-text-muted); font-weight: 600;">Expira en:</span>
        <div style="display: flex; gap: 8px; font-weight: 800; font-size: 1.2rem; color: #ef4444;">
          <span id="flash-hours">04</span><small style="color: #fff;">h</small> :
          <span id="flash-minutes">28</span><small style="color: #fff;">m</small> :
          <span id="flash-seconds">45</span><small style="color: #fff;">s</small>
        </div>
      </div>
    </div>

    <!-- Flash Items Grid -->
    <div id="flash-products-grid" style="display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 24px;">
      <!-- Injected dynamically via JS -->
    </div>
  </div>
</section>
